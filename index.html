<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="X-DNS-Prefetch-Control" content="off">
  <title>Akkoord inkomstenbelasting</title>
  <style>
    /* The layout of the MyTaxMate customer page (features/customerPage), tokens from the TaxMate design system. */
    @font-face { font-family: "Axiforma"; src: url("/assets/Axiforma-Regular.woff2") format("woff2"); font-weight: 400; font-display: swap; }
    @font-face { font-family: "Axiforma"; src: url("/assets/Axiforma-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: swap; }
    @font-face { font-family: "Axiforma"; src: url("/assets/Axiforma-Bold.woff2") format("woff2"); font-weight: 700; font-display: swap; }

    :root {
      --canvas: #F1F3F3;
      --surface: #FFFFFF;
      --navy: #1F3C4E;
      --ink: #142D3D;
      --body: #33505F;
      --muted: #4B6674;
      --mint: #83D4C0;
      --mint-deep: #56B89F;
      --mint-link: #256A59;
      --tea: #BDE0D7;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--canvas);
      color: var(--body);
      font-family: "Axiforma", "Avenir Next", "Segoe UI", Arial, Helvetica, sans-serif;
      font-size: 16px;
      line-height: 1.6;
    }

    .frame { display: flex; gap: 32px; min-height: 100dvh; padding: 40px; }

    .side {
      flex: 1 1 420px;
      display: flex;
      flex-direction: column;
      gap: 40px;
      min-width: 0;
      padding: 40px;
      border-radius: 20px;
      background: var(--navy) url("/assets/bg-lines.jpg") center / cover no-repeat;
      color: #FFFFFF;
    }

    .logo { display: block; height: 36px; width: auto; align-self: flex-start; }

    .label { margin: 0; font-size: 40px; font-weight: 700; line-height: 1.1; letter-spacing: -0.02em; }

    .period { margin: 8px 0 0; color: rgba(255, 255, 255, 0.75); }

    .info {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-top: auto;
      padding: 20px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.08);
      font-size: 15px;
      line-height: 1.55;
    }

    .info p { display: flex; gap: 12px; margin: 0; color: rgba(255, 255, 255, 0.88); }
    .info svg { flex: none; margin-top: 2px; color: var(--mint); }
    .info a { color: var(--mint); font-weight: 600; }

    .below { display: none; }

    .card {
      flex: 1 1 560px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-width: 0;
      padding: 56px;
      border-radius: 20px;
      background: var(--surface);
    }

    .content { width: 100%; max-width: 520px; margin: 0 auto; }

    h1 {
      margin: 0 0 12px;
      color: var(--ink);
      font-size: 28px;
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -0.02em;
    }

    p { margin: 0 0 8px; }

    .steps { display: flex; flex-direction: column; gap: 16px; margin: 32px 0 0; padding: 0; list-style: none; counter-reset: step; }

    .steps li { display: flex; align-items: flex-start; gap: 14px; color: var(--ink); counter-increment: step; }

    .steps li::before {
      content: counter(step);
      flex: none;
      width: 30px;
      height: 30px;
      border-radius: 999px;
      background: var(--tea);
      color: var(--ink);
      font-size: 14px;
      font-weight: 700;
      line-height: 30px;
      text-align: center;
    }

    .steps li span { padding-top: 3px; }

    .accent, .help { margin: 16px 0 0; color: var(--muted); font-size: 14px; }

    .help a { color: var(--mint-link); font-weight: 600; }

    form { margin: 32px 0 0; }

    button {
      width: 100%;
      min-height: 48px;
      padding: 12px 24px;
      border: 0;
      border-radius: 12px;
      background: var(--mint);
      color: var(--ink);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover { background: var(--mint-deep); }
    button:focus-visible, a:focus-visible { outline: 0; box-shadow: 0 0 0 3px rgba(131, 212, 192, 0.45); }

    @media (max-width: 900px) {
      .frame { flex-direction: column; gap: 16px; min-height: 0; padding: 16px; }
      .side { flex: none; gap: 24px; padding: 24px; }
      .logo { height: 28px; }
      .label { font-size: 30px; }
      .card { flex: none; padding: 24px; }
      .side .info { display: none; }
      .below { display: flex; margin-top: 0; border-color: rgba(31, 60, 78, 0.08); background: var(--surface); }
      .below p { color: var(--body); }
      .below svg { color: var(--mint-link); }
      .below a { color: var(--mint-link); }
    }
  </style>
</head>
<body>
  <div class="frame">
    <aside class="side">
      <img class="logo" src="/assets/TaxMate_Full_Logo_White.png" alt="TaxMate">
      <div>
        <p class="label">{{label}}</p>{{period}}
      </div>
      <div class="info">
        <p>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></svg>
          <span>{{safe}}</span>
        </p>
        <p>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          <span>{{questions}}</span>
        </p>
      </div>
    </aside>
    <main class="card">
      <div class="content">
        {{content}}
      </div>
    </main>
    <div class="info below">
      <p>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></svg>
        <span>{{safe}}</span>
      </p>
      <p>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span>{{questions}}</span>
      </p>
    </div>
  </div>
</body>
</html>
